<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Diffusion LLM Visualizer">
  <defs>
    <!-- Left (masked/dim) to right (resolved/bright): the denoising sweep. -->
    <linearGradient id="denoise" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="216" y2="0">
      <stop offset="0" stop-color="#245a34" />
      <stop offset="1" stop-color="#00ff41" />
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="48" fill="#0a0a0a" />
  <rect x="0.75" y="0.75" width="254.5" height="254.5" rx="47.25" fill="none" stroke="#1e1e1e" stroke-width="1.5" />

  <!-- Four rows of "tokens" resolving left to right (last line short). -->
  <g fill="url(#denoise)">
    <rect x="40" y="64" width="44" height="18" rx="6" />
    <rect x="92" y="64" width="30" height="18" rx="6" />
    <rect x="130" y="64" width="58" height="18" rx="6" />

    <rect x="40" y="106" width="58" height="18" rx="6" />
    <rect x="106" y="106" width="26" height="18" rx="6" />
    <rect x="140" y="106" width="48" height="18" rx="6" />

    <rect x="40" y="148" width="34" height="18" rx="6" />
    <rect x="82" y="148" width="50" height="18" rx="6" />
    <rect x="140" y="148" width="48" height="18" rx="6" />

    <rect x="40" y="190" width="44" height="18" rx="6" />
    <rect x="92" y="190" width="40" height="18" rx="6" />
  </g>
</svg>
