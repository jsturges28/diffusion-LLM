<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Visualizer</title>
  <link rel="stylesheet" href="/vendor/fonts/jetbrains-mono.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="menu-body">
  <!-- Animated background grid + floating characters (also the
       backdrop fallback if the title video cannot play). -->
  <div id="bg-grid"></div>
  <div id="bg-floaters" aria-hidden="true"></div>

  <!-- Looping, muted title-screen video backdrop. muted + playsinline
       are required for autoplay to start in browsers and WebKitGTK. -->
  <video id="menu-video" class="menu-video" autoplay loop muted playsinline
    aria-hidden="true" tabindex="-1">
    <!-- WebM (VP9) first: it decodes in webviews that lack the
         proprietary H.264 codec (e.g. QtWebEngine / WebKitGTK builds).
         The MP4 is the fallback for engines without WebM. -->
    <source src="/assets/title-screen.webm" type="video/webm" />
    <source src="/assets/title-screen.mp4" type="video/mp4" />
  </video>
  <div id="menu-scrim" class="menu-scrim" aria-hidden="true"></div>

  <main id="menu">
    <section id="menu-panel" class="menu-panel">
      <h1 class="menu-title">
        <span class="title-accent">LLM</span> Visualizer
      </h1>
      <p class="menu-subtitle">Select a model to begin</p>

      <div id="menu-system" class="menu-system menu-system-checking">
        <span class="menu-system-spinner" aria-hidden="true"></span>
        <span id="menu-system-text">
          Checking for GPU and availability&hellip;
        </span>
      </div>

      <ul id="menu-model-list" class="menu-model-list"
        role="listbox" aria-label="Available models"></ul>

      <div id="menu-activation" class="menu-activation" hidden>
        <div id="menu-activation-progress"
          class="menu-activation-progress" hidden>
          <span id="menu-activation-pct"
            class="menu-activation-pct"></span>
          <span class="menu-activation-bar">
            <span id="menu-activation-fill"
              class="menu-activation-fill"></span>
          </span>
        </div>
        <button id="menu-activation-cancel" type="button"
          class="menu-activation-cancel">Cancel</button>
      </div>

      <p id="menu-error" class="menu-error" hidden></p>

      <nav class="menu-links">
        <a href="/analytics.html" class="header-link">Analytics<span id="menu-analytics-new" class="analytics-new-dot is-empty" aria-hidden="true"></span></a>
      </nav>

      <!-- Model pagination, pinned to the panel's bottom-left corner. -->
      <div id="menu-pager" class="menu-pager" hidden>
        <button id="menu-page-prev" type="button"
          class="prompt-hist-nav-btn" title="Previous page"
          aria-label="Previous page">&lsaquo;</button>
        <span id="menu-page-counter">1 / 1</span>
        <button id="menu-page-next" type="button"
          class="prompt-hist-nav-btn" title="Next page"
          aria-label="Next page">&rsaquo;</button>
      </div>

      <!-- Settings gear, pinned to the panel's bottom-right corner. -->
      <a href="/settings.html"
        class="header-link header-link-icon menu-settings-link"
        title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </a>
    </section>
  </main>

  <script src="/overlays.js"></script>
  <script src="/model_client.js"></script>
  <script src="/activation_client.js"></script>
  <script src="/download_toast.js"></script>
  <script src="/menu.js"></script>
</body>
</html>
